name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
      - run: uv sync --locked --extra notebook --python '${{ matrix.python }}'
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - run: uv pip check

  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.23'
      - run: uv sync --locked --extra notebook
      - run: uv pip check
      - run: uv export --locked --extra notebook --no-dev --no-emit-project --no-hashes --no-annotate --no-header --format requirements-txt --output-file /tmp/requirements.txt --quiet
      - run: uv export --locked --all-extras --all-groups --no-emit-project --no-hashes --no-annotate --no-header --format requirements-txt --output-file /tmp/requirements-dev.txt --quiet
      - name: Check exported versions
        run: |
          diff -u requirements.txt /tmp/requirements.txt
          diff -u requirements-dev.txt /tmp/requirements-dev.txt
      - run: uv run --no-sync python scripts/validate_notebooks.py
